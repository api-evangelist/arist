    url: scopes/arist-scopes.yml
- aid: arist:platform
  name: Arist Platform API
  description: 'The Arist platform API host at api.arist.app fronts an Amazon API Gateway
    deployment and answers every anonymous request with a 403 MissingAuthenticationToken,
    so the surface is real but entirely credential-gated. Arist does not publish an
    OpenAPI definition, a developer portal, SDKs or a CLI; customer integrations with
    HRIS, CRM, ATS and LMS systems are built by Arist through Workato, which stores
    the Arist API credentials and connection details on the customer''s behalf. Contract
    discovery probed /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json,
    /api-docs, /docs, /redoc and /graphql on this host — all returned the same gated
    403 — so no machine-readable contract could be harvested.'
  humanURL: https://help.arist.co/category/107-data-integrations-and-delivery-methods
  baseURL: https://api.arist.app
