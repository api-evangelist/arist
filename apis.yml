aid: arist
name: Arist
description: 'Arist is an AI-native enterprise enablement platform, founded in 2019
  and headquartered in New York City, that delivers training, communications, nudges
  and surveys in the flow of work over SMS, WhatsApp, Slack, Microsoft Teams, email
  and its own web and mobile apps rather than through a traditional LMS portal. The
  product is packaged as an agent suite — a Needs Analysis agent that interviews employees
  and syncs HRIS/CRM/LMS data, a Creator agent that generates and translates courses
  into 50+ languages, a Core Platform and Routing agent that decides who receives what
  and where, and an Analytics agent that ties delivery back to business goals. Customer
  systems (Workday, Salesforce, SAP SuccessFactors, Cornerstone, ServiceNow, Oracle)
  are connected through Workato-hosted connectors rather than a publicly documented
  REST API; the platform API host at api.arist.app is credential-gated and no public
  OpenAPI, SDK or developer portal is published. Identity is handled by an Auth0 tenant
  at auth.arist.app supporting SAML and OIDC single sign-on plus one-time email passcodes.'
