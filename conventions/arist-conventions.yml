  headers: []
delivery_conventions:
  description: |
    Arist's real published convention surface is how content is delivered to learners and
    how learners control it, not HTTP semantics.
  channels: [SMS, WhatsApp, Slack, Microsoft Teams, Email, Arist Messenger, Arist Web App,
    Arist mobile app]
  system_keywords:
    docs: https://help.arist.co/article/1064-system-keywords
    stop:
      applies_to: [SMS, WhatsApp, Email]
      excludes: [Microsoft Teams, Slack, Arist Messenger]
      changed: '2026-06'
  sms:
    docs: https://help.arist.co/article/1057-sms-delivery-and-sender-ids
    sender_ids: documented
    toll_free: true
    tcpa_compliant: claimed
  whatsapp:
    docs: https://help.arist.co/article/1047-whatsapp-course-requirements
    note: WhatsApp courses have template/content requirements documented separately
  email:
