generated: '2026-08-02'
method: searched
source: https://help.arist.co/ + https://auth.arist.app/.well-known/openid-configuration
note: |
  Arist ships no public API contract, so most of the cross-cutting HTTP semantics this
  artifact normally captures simply do not exist in public. Recorded here as absence
  (documented: false) rather than invented. What Arist DOES publish conventions for is its
  delivery surface — the messaging channels learners receive content on — and its identity
  layer. Both are captured below.
authentication:
  style: openid-connect / saml federation
  issuer: https://auth.arist.app/
  bearer_tokens: JWT (RS256/PS256/HS256 id_token signing advertised)
  pkce: required-capable (S256)
  sender_constraining: DPoP (ES256) advertised
  api_credentials: |
    The platform API at api.arist.app expects a credential that Arist does not document
    publicly; customer integrations are brokered by Workato, which stores the Arist API
    credentials and connection details on the customer's behalf.
  see_also: authentication/arist-authentication.yml
idempotency:
  documented: false
  header: null
  note: No idempotency key, retry contract or replay window is documented. No Idempotency
    pointer is claimed for this provider.
pagination:
  documented: false
  style: null
  note: No public API reference, so no pagination contract is published.
field_expansion:
  documented: false
sparse_fieldsets:
  documented: false
metadata:
  documented: false
request_tracing:
  documented: false
  note: api.arist.app is fronted by Amazon API Gateway, which returns x-amzn-RequestId and
    x-amz-apigw-id response headers on the observed 403 responses; these are platform
    defaults, not a documented Arist tracing contract.
versioning:
  documented: false
  see_also: lifecycle/arist-lifecycle.yml
