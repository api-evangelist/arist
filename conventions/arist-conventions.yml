  docs: https://help.arist.co/article/1071-how-arist-builds-data-integrations
  overview: https://help.arist.co/article/1017-integration-overview-connecting-arist-with-your-environment
  systems: [Workday, Salesforce, SAP SuccessFactors, Oracle, ServiceNow, Cornerstone, PowerBI]
  oauth_note: Apps authorized through OAuth 2.0 require an additional step after the connector
    is configured, for the customer's application administrators to manually authorize Arist
    to access their data.
  bulk_load: CSV cohort upload (https://help.arist.co/article/1072-uploading-a-cohort-via-csv)
  support: integrations-support@arist.co
